configuration:
  satellites:
    name: Satellites
    description: Liste des sources satellites VBAN
    fields:
      tts_output:
        name: Sortie TTS
        description: "Ou jouer les reponses : vban ou media_player"
      tts_media_player:
        name: Lecteur multimedia TTS
        description: Entite media_player utilisee quand la sortie TTS est media_player (ex. media_player.nestmini7039)
      tts_http_port:
        name: Port HTTP TTS
        description: Port servant l'audio TTS au lecteur (defaut 10800 + position du satellite)
      tts_http_host:
        name: Hote HTTP TTS
        description: IP LAN de cet hote utilisee dans l'URL TTS (vide = detection automatique)
      mic_mute_tail_ms:
        name: Marge de coupure micro (ms)
        description: Sortie media_player - garder le micro coupe ce temps apres la lecture de la reponse (defaut 250, 0 = aucune)
      followup_enabled:
        name: Relance sans mot-cle
        description: Quand la reponse est une question, ecouter la reponse sans mot-cle (active par defaut)
      followup_beep:
        name: Bip de relance
        description: Bip sur la sortie du satellite quand il ecoute la reponse (active par defaut)
      followup_timeout_s:
        name: Delai de relance (s)
        description: Retour a l'ecoute du mot-cle si personne ne parle dans ce delai (3-30, defaut 8)
      thinking_sound_enabled:
        name: Son de reflexion
        description: Jouer un son doux quand la reponse tarde (active par defaut)
      search_sound_enabled:
        name: Son de recherche internet
        description: Jouer un son sur l'evenement jarvis_recherche, quand une recherche internet commence (active par defaut)
      thinking_delay_ms:
        name: Delai du son de reflexion (ms)
        description: Jouer le son de reflexion si pas de reponse apres ce delai (300-5000, defaut 1000)
      thinking_sound:
        name: Fichier du son de reflexion
        description: Fichier WAV remplacant le son integre, ex. /share/jarvis/reflexion.wav (vide = son integre)
      search_sound:
        name: Fichier du son de recherche
        description: Fichier WAV remplacant le son de recherche integre (vide = son integre)
      vision_phrase_enabled:
        name: Phrase de regard camera
        description: Dire une phrase sur l'evenement jarvis_vision, pendant l'analyse de la photo de la camera (active par defaut)
      vision_phrase:
        name: Texte de la phrase camera
        description: Par defaut "Attends, je regarde."
      vision_tts_engine:
        name: Moteur TTS de la phrase
        description: Entite TTS utilisee pour synthetiser la phrase (defaut tts.piper)
      vision_tts_voice:
        name: Voix de la phrase
        description: Voix utilisee pour la phrase (defaut fr_FR-siwis-medium)
  publish_exchanges:
    name: Publier les echanges
    description: Envoyer un evenement Home Assistant jarvis_echange pour chaque demande et reponse (satellite, transcript, reponse, relance)
  debug_logging:
    name: Journalisation de debogage
    description: Activer la journalisation detaillee
