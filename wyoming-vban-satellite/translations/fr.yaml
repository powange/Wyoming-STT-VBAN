configuration:
  satellites:
    name: Satellites
    description: Liste des sources satellites VBAN
    fields:
      name:
        name: Nom
        description: Nom du satellite affiche dans Home Assistant
      wyoming_port:
        name: Port Wyoming
        description: Port TCP de ce satellite, unique par satellite (ex. 10700, 10701...)
      output:
        name: Sortie des reponses
        description: 'vban (defaut) : bloc Sortie VBAN ; media_player : bloc Media player (Sortie VBAN en secours si activee) ; none : reponses non jouees (ex. pour tester un micro)'
      microphone:
        name: Micro
        description: Flux VBAN du micro
        fields:
          source:
            name: Source
            description: 'vban (defaut) : flux VBAN ; rtsp : audio d''un flux camera (ex. go2rtc)'
          rtsp_url:
            name: URL du flux camera
            description: Seulement avec la source rtsp, ex. rtsp://192.168.0.201:8554/chambre
          rtsp_transport:
            name: Transport RTSP
            description: tcp (defaut) ou udp
          vban_port:
            name: Port VBAN
            description: Port UDP qui recoit le flux du micro (partageable entre satellites) ; seulement avec la source vban
          vban_mode:
            name: Mode VBAN
            description: unicast (defaut) ou multicast
          multicast_group:
            name: Groupe multicast
            description: Seulement en mode multicast, ex. 239.0.0.1
          stream_name:
            name: Nom du flux VBAN
            description: Flux dirige vers ce satellite (vide = tout flux non reclame par un autre satellite du port)
      vban_output:
        name: Sortie VBAN
        description: Reponses envoyees en flux VBAN (laisser vide si inutilise)
        fields:
          enabled:
            name: Activee
            description: 'Envoyer les reponses en flux VBAN (desactive par defaut ; avec la sortie media_player : secours si play_media echoue)'
          mode:
            name: Mode
            description: unicast (defaut) ou multicast
          address:
            name: Adresse
            description: IP de l'enceinte (ex. l'Atom), obligatoire si activee
          port:
            name: Port
            description: Defaut 6980
          stream_name:
            name: Nom du flux
            description: Defaut TTS1
          volume:
            name: Volume
            description: 0.0-2.0 (defaut 1.0)
          batch_packets:
            name: Paquets par envoi
            description: 1-8 (defaut 1, le plus regulier pour les recepteurs ESP32)
      media_player:
        name: Media player
        description: Utilise seulement si sortie = media_player (laisser vide sinon)
        fields:
          entity:
            name: Entite
            description: Entite media_player, ex. media_player.nestmini7039 (obligatoire si sortie = media_player)
          http_port:
            name: Port HTTP
            description: Defaut 10800 + position du satellite
          http_host:
            name: Hote HTTP
            description: IP LAN de cet hote dans l'URL (vide = detection automatique)
          mic_mute_tail_ms:
            name: Marge de coupure micro (ms)
            description: Micro coupe ce temps apres la reponse (defaut 250)
      followup:
        name: Relance
        description: Repondre a une question sans mot-cle (vide = valeurs par defaut)
        fields:
          enabled:
            name: Activee
            description: Quand la reponse est une question, ecouter la reponse sans mot-cle (active par defaut)
          beep:
            name: Bip
            description: Bip quand le satellite ecoute (active par defaut)
          timeout_s:
            name: Delai (s)
            description: Retour au mot-cle sans parole (3-30, defaut 8)
      waiting_sounds:
        name: Annonces d'attente
        description: Ce que le satellite joue entre votre demande et la reponse (vide = valeurs par defaut)
        fields:
          listen_end_mode:
            name: Fin d'ecoute
            description: 'none (defaut) ou sound : petit bip des que la demande est enregistree'
          listen_end_file:
            name: Son de fin d'ecoute
            description: WAV remplacant le bip integre, ex. /share/jarvis/fin.wav
          thinking_mode:
            name: Reflexion
            description: 'Si pas de reponse apres le delai : none (rien), sound (son), phrase (texte parle) ou sound_then_phrase (son puis phrase) (defaut phrase)'
          thinking_delay_ms:
            name: Delai de reflexion (ms)
            description: 300-5000 (defaut 1000)
          thinking_text:
            name: Phrase de reflexion
            description: Defaut "Je réfléchis."
          thinking_file:
            name: Son de reflexion
            description: WAV remplacant le son integre
          search_mode:
            name: Recherche internet
            description: 'Sur l''evenement jarvis_recherche : none (rien), sound (son), phrase (texte parle) ou sound_then_phrase (son puis phrase) (defaut sound_then_phrase)'
          search_text:
            name: Phrase de recherche
            description: Defaut "Je cherche sur internet."
          search_file:
            name: Son de recherche
            description: WAV remplacant le son integre
          thinking:
            name: (ancien) Son de reflexion oui/non
            description: Avant 3.2 ; utilise seulement si Reflexion est vide (oui = son). Preferer Reflexion
          search:
            name: (ancien) Son de recherche oui/non
            description: Avant 3.2 ; utilise seulement si Recherche internet est vide (oui = son). Preferer Recherche internet
      camera_phrase:
        name: Annonce camera
        description: Sur l'evenement jarvis_vision, quand Jarvis regarde une camera (vide = valeurs par defaut)
        fields:
          mode:
            name: Mode
            description: none (rien), sound (son), phrase (texte parle) ou sound_then_phrase (son puis phrase) (defaut phrase)
          text:
            name: Phrase
            description: Defaut "Attends, j'observe."
          file:
            name: Fichier son
            description: WAV joue dans les modes avec son (pas de son integre)
          tts_engine:
            name: Moteur TTS
            description: Pour les phrases de ce satellite (vide = option de l'app)
          tts_voice:
            name: Voix TTS
            description: Pour les phrases de ce satellite (vide = option de l'app)
          enabled:
            name: (ancien) Activee
            description: Avant 3.2 ; utilise seulement si Mode est vide (non = none). Preferer Mode
  publish_exchanges:
    name: Publier les echanges
    description: Envoyer un evenement Home Assistant jarvis_echange pour chaque demande et reponse (satellite, transcript, reponse, relance)
  announcements_tts_engine:
    name: Moteur TTS des annonces
    description: Entite TTS qui synthetise les annonces parlees (defaut tts.piper)
  announcements_tts_voice:
    name: Voix des annonces
    description: Voix des annonces parlees (defaut fr_FR-siwis-medium)
  debug_mirror:
    name: Copies audio de debug
    description: Envoyer une copie de l'audio d'un satellite en flux VBAN, ex. pour l'ecouter avec VBAN Receptor ou VoiceMeeter (vide = aucune)
    fields:
      satellite:
        name: Satellite
        description: Nom du satellite, exactement comme configure (ex. VBAN Satellite Bureau)
      stream:
        name: Flux
        description: 'mic_received : micro tel que recu ; mic_sent : audio envoye a Home Assistant (16 kHz, avec les coupures) ; tts : reponses'
      address:
        name: Adresse
        description: IP de l'ordinateur qui recoit la copie
      port:
        name: Port
        description: Port UDP (defaut 6980)
      stream_name:
        name: Nom du flux VBAN
        description: Par defaut <dernier mot du nom du satellite>-rx / -tx / -tts, ex. Bureau-tx (16 caracteres max)
  debug_logging:
    name: Journalisation de debogage
    description: Activer la journalisation detaillee
