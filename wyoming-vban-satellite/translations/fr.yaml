configuration:
  satellites:
    name: Satellites
    description: Liste des sources satellites VBAN
    fields:
      name:
        name: Nom
        description: Nom du satellite affiche dans Home Assistant
      wyoming_port:
        name: Port Wyoming
        description: Port TCP de ce satellite, unique par satellite (ex. 10700, 10701...)
      vban_receive_port:
        name: '[Micro] Port VBAN'
        description: Port UDP qui recoit le flux du micro (partageable entre satellites)
      vban_receive_mode:
        name: '[Micro] Mode VBAN'
        description: unicast ou multicast
      vban_receive_multicast_group:
        name: '[Micro] Groupe multicast'
        description: Seulement en mode multicast, ex. 239.0.0.1
      vban_receive_stream_name:
        name: '[Micro] Nom du flux VBAN'
        description: Flux dirige vers ce satellite (vide = tout flux non reclame par un autre satellite du port)
      tts_output:
        name: '[Sortie] Sortie des reponses'
        description: 'vban (defaut) ou media_player : determine si les champs [Sortie VBAN] ou [Media player] sont utilises'
      tts_vban_enabled:
        name: '[Sortie VBAN] Activee'
        description: 'Envoyer les reponses en flux VBAN (avec la sortie media_player : secours si play_media echoue)'
      tts_vban_mode:
        name: '[Sortie VBAN] Mode'
        description: Seulement si la sortie VBAN est activee
      tts_vban_address:
        name: '[Sortie VBAN] Adresse'
        description: IP de l'enceinte (ex. l'Atom). Seulement si la sortie VBAN est activee
      tts_vban_port:
        name: '[Sortie VBAN] Port'
        description: Seulement si la sortie VBAN est activee (defaut 6980)
      tts_vban_stream_name:
        name: '[Sortie VBAN] Nom du flux'
        description: Seulement si la sortie VBAN est activee
      tts_vban_volume:
        name: '[Sortie VBAN] Volume'
        description: 0.0-2.0 (defaut 1.0)
      tts_vban_batch_packets:
        name: '[Sortie VBAN] Paquets par envoi'
        description: 1-8 (defaut 1, le plus regulier pour les recepteurs ESP32)
      tts_media_player:
        name: '[Media player] Entite'
        description: Seulement si sortie = media_player, ex. media_player.nestmini7039
      tts_http_port:
        name: '[Media player] Port HTTP'
        description: Seulement si sortie = media_player (defaut 10800 + position du satellite)
      tts_http_host:
        name: '[Media player] Hote HTTP'
        description: 'Seulement si sortie = media_player : IP LAN de cet hote dans l''URL (vide = detection automatique)'
      mic_mute_tail_ms:
        name: '[Media player] Marge de coupure micro (ms)'
        description: 'Seulement si sortie = media_player : micro coupe ce temps apres la reponse (defaut 250)'
      followup_enabled:
        name: '[Relance] Activee'
        description: Quand la reponse est une question, ecouter la reponse sans mot-cle (active par defaut)
      followup_beep:
        name: '[Relance] Bip'
        description: 'Seulement si la relance est activee : bip quand le satellite ecoute (active par defaut)'
      followup_timeout_s:
        name: '[Relance] Delai (s)'
        description: 'Seulement si la relance est activee : retour au mot-cle sans parole (3-30, defaut 8)'
      thinking_sound_enabled:
        name: '[Sons d''attente] Son de reflexion'
        description: Son doux quand la reponse tarde (active par defaut)
      thinking_delay_ms:
        name: '[Sons d''attente] Delai de reflexion (ms)'
        description: Seulement si le son de reflexion est active (300-5000, defaut 1000)
      thinking_sound:
        name: '[Sons d''attente] Fichier du son de reflexion'
        description: 'Seulement si le son de reflexion est active : WAV remplacant le son integre, ex. /share/jarvis/reflexion.wav'
      search_sound_enabled:
        name: '[Sons d''attente] Son de recherche internet'
        description: Son sur l'evenement jarvis_recherche (active par defaut)
      search_sound:
        name: '[Sons d''attente] Fichier du son de recherche'
        description: 'Seulement si le son de recherche est active : WAV remplacant le son integre'
      vision_phrase_enabled:
        name: '[Camera] Phrase activee'
        description: Dire une phrase sur l'evenement jarvis_vision (active par defaut)
      vision_phrase:
        name: '[Camera] Phrase'
        description: Seulement si la phrase est activee (defaut "Attends, je regarde.")
      vision_tts_engine:
        name: '[Camera] Moteur TTS'
        description: Seulement si la phrase est activee (defaut tts.piper)
      vision_tts_voice:
        name: '[Camera] Voix TTS'
        description: Seulement si la phrase est activee (defaut fr_FR-siwis-medium)
  publish_exchanges:
    name: Publier les echanges
    description: Envoyer un evenement Home Assistant jarvis_echange pour chaque demande et reponse (satellite, transcript, reponse, relance)
  debug_logging:
    name: Journalisation de debogage
    description: Activer la journalisation detaillee
