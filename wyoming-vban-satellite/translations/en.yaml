configuration:
  satellites:
    name: Satellites
    description: List of VBAN satellite sources
    fields:
      tts_output:
        name: TTS output
        description: "Where responses are played: vban or media_player"
      tts_media_player:
        name: TTS media player
        description: media_player entity used when TTS output is media_player (e.g. media_player.nestmini7039)
      tts_http_port:
        name: TTS HTTP port
        description: Port serving TTS audio to the media player (default 10800 + satellite position)
      tts_http_host:
        name: TTS HTTP host
        description: LAN IP of this host used in the TTS URL (empty = auto-detect)
      mic_mute_tail_ms:
        name: Mic mute tail (ms)
        description: media_player output - keep the mic muted this long after the response has played (default 250, 0 = none)
      followup_enabled:
        name: Follow-up without wake word
        description: When a response is a question, listen for the answer without the wake word (default on)
      followup_beep:
        name: Follow-up beep
        description: Beep on the satellite output when listening for the answer (default on)
      followup_timeout_s:
        name: Follow-up timeout (s)
        description: Back to wake word listening if no speech within this time (3-30, default 8)
      thinking_sound_enabled:
        name: Thinking sound
        description: Play a soft sound when the response takes a while (default on)
      search_sound_enabled:
        name: Internet search sound
        description: Play a sound on the jarvis_recherche event, when an internet search starts (default on)
      thinking_delay_ms:
        name: Thinking sound delay (ms)
        description: Play the thinking sound if no response after this time (300-5000, default 1000)
      thinking_sound:
        name: Thinking sound file
        description: WAV file replacing the built-in thinking sound, e.g. /share/jarvis/thinking.wav (empty = built-in)
      search_sound:
        name: Internet search sound file
        description: WAV file replacing the built-in search sound (empty = built-in)
  publish_exchanges:
    name: Publish exchanges
    description: Fire a jarvis_echange Home Assistant event with each request and response (satellite, transcript, response, follow-up)
  debug_logging:
    name: Debug Logging
    description: Enable verbose debug logging
