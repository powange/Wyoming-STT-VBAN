configuration:
  satellites:
    name: Satellites
    description: List of VBAN satellite sources
    fields:
      name:
        name: Name
        description: Satellite name shown in Home Assistant
      wyoming_port:
        name: Wyoming port
        description: TCP port of this satellite, unique per satellite (e.g. 10700, 10701...)
      output:
        name: Response output
        description: 'vban (default): the VBAN output block; media_player: the Media player block (VBAN output as fallback if enabled); none: responses are not played (e.g. to test a microphone)'
      microphone:
        name: Microphone
        description: VBAN stream of the microphone
        fields:
          source:
            name: Source
            description: 'vban (default): VBAN stream; rtsp: audio of a camera stream (e.g. go2rtc)'
          rtsp_url:
            name: Camera stream URL
            description: Only with source rtsp, e.g. rtsp://192.168.0.201:8554/chambre
          rtsp_transport:
            name: RTSP transport
            description: tcp (default) or udp
          vban_port:
            name: VBAN port
            description: UDP port receiving the microphone stream (several satellites can share it); only with source vban
          vban_mode:
            name: VBAN mode
            description: unicast (default) or multicast
          multicast_group:
            name: Multicast group
            description: Only in multicast mode, e.g. 239.0.0.1
          stream_name:
            name: VBAN stream name
            description: Stream routed to this satellite (empty = any stream not claimed by another satellite on the port)
      vban_output:
        name: VBAN output
        description: Responses sent as a VBAN stream (leave empty if unused)
        fields:
          enabled:
            name: Enabled
            description: 'Send responses as a VBAN stream (default off; with media_player output: fallback if play_media fails)'
          mode:
            name: Mode
            description: unicast (default) or multicast
          address:
            name: Address
            description: IP of the speaker (e.g. the Atom), required if enabled
          port:
            name: Port
            description: Default 6980
          stream_name:
            name: Stream name
            description: Default TTS1
          volume:
            name: Volume
            description: 0.0-2.0 (default 1.0)
          batch_packets:
            name: Packets per send
            description: 1-8 (default 1, smoothest for ESP32 receivers)
      media_player:
        name: Media player
        description: Only used if output = media_player (leave empty otherwise)
        fields:
          entity:
            name: Entity
            description: media_player entity, e.g. media_player.nestmini7039 (required if output = media_player)
          http_port:
            name: HTTP port
            description: Default 10800 + satellite position
          http_host:
            name: HTTP host
            description: LAN IP of this host in the URL (empty = auto-detect)
          mic_mute_tail_ms:
            name: Mic mute tail (ms)
            description: Mic kept muted this long after the response (default 250)
      followup:
        name: Follow-up
        description: Answer a question without the wake word (empty = defaults)
        fields:
          enabled:
            name: Enabled
            description: When a response is a question, listen for the answer without the wake word (default on)
          beep:
            name: Beep
            description: Beep when listening (default on)
          timeout_s:
            name: Timeout (s)
            description: Back to the wake word without speech (3-30, default 8)
      waiting_sounds:
        name: Announcements while waiting
        description: What the satellite plays between your request and the response (empty = defaults)
        fields:
          listen_end_mode:
            name: End of listening
            description: 'none (default) or sound: short blip as soon as your request is recorded'
          listen_end_file:
            name: End of listening sound file
            description: WAV replacing the built-in blip, e.g. /share/jarvis/fin.wav
          thinking_mode:
            name: Thinking
            description: 'When no response after the delay: none, sound, phrase (spoken text), or sound_then_phrase (default phrase)'
          thinking_delay_ms:
            name: Thinking delay (ms)
            description: 300-5000 (default 1000)
          thinking_text:
            name: Thinking phrase
            description: Default "Je réfléchis."
          thinking_file:
            name: Thinking sound file
            description: WAV replacing the built-in sound
          search_mode:
            name: Internet search
            description: 'On the jarvis_recherche event: none, sound, phrase (spoken text), or sound_then_phrase (default sound_then_phrase)'
          search_text:
            name: Internet search phrase
            description: Default "Je cherche sur internet."
          search_file:
            name: Internet search sound file
            description: WAV replacing the built-in sound
          thinking:
            name: (old) Thinking sound on/off
            description: Before 3.2; used only if Thinking is empty (on = sound). Prefer Thinking
          search:
            name: (old) Search sound on/off
            description: Before 3.2; used only if Internet search is empty (on = sound). Prefer Internet search
      camera_phrase:
        name: Camera announcement
        description: On the jarvis_vision event, when Jarvis looks at a camera (empty = defaults)
        fields:
          mode:
            name: Mode
            description: none, sound, phrase (spoken text), or sound_then_phrase (default phrase)
          text:
            name: Phrase
            description: Default "Attends, j'observe."
          file:
            name: Sound file
            description: WAV played in sound modes (no built-in sound)
          tts_engine:
            name: TTS engine
            description: For this satellite's phrases (empty = app option)
          tts_voice:
            name: TTS voice
            description: For this satellite's phrases (empty = app option)
          enabled:
            name: (old) Enabled
            description: Before 3.2; used only if Mode is empty (off = none). Prefer Mode
  publish_exchanges:
    name: Publish exchanges
    description: Fire a jarvis_echange Home Assistant event with each request and response (satellite, transcript, response, follow-up)
  announcements_tts_engine:
    name: Announcements TTS engine
    description: TTS entity synthesizing the spoken announcements (default tts.piper)
  announcements_tts_voice:
    name: Announcements TTS voice
    description: Voice of the spoken announcements (default fr_FR-siwis-medium)
  debug_mirror:
    name: Debug audio copies
    description: Send a copy of a satellite's audio as a VBAN stream, e.g. to listen with VBAN Receptor or VoiceMeeter (empty = none)
    fields:
      satellite:
        name: Satellite
        description: Satellite name, exactly as configured (e.g. VBAN Satellite Bureau)
      stream:
        name: Stream
        description: 'mic_received: microphone as received; mic_sent: audio sent to Home Assistant (16 kHz, with mutes); tts: responses'
      address:
        name: Address
        description: IP of the computer receiving the copy
      port:
        name: Port
        description: UDP port (default 6980)
      stream_name:
        name: VBAN stream name
        description: Default <last word of the satellite name>-rx / -tx / -tts, e.g. Bureau-tx (16 characters max)
  debug_logging:
    name: Debug Logging
    description: Enable verbose debug logging
