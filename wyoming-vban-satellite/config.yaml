name: "Wyoming VBAN Satellite"
description: "Use VBAN audio sources as Wyoming voice assistant satellites for Home Assistant"
version: "3.0.0"
slug: wyoming-vban-satellite
url: "https://github.com/powange/Wyoming-STT-VBAN"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
homeassistant_api: true
host_network: true
map:
  - config:rw
  - share:ro
options:
  satellites:
    - name: "VBAN Satellite 1"
      wyoming_port: 10700
      output: "vban"
      microphone:
        vban_port: 6980
        vban_mode: "unicast"
      vban_output:
        enabled: false
      media_player: {}
      followup: {}
      waiting_sounds: {}
      camera_phrase: {}
  publish_exchanges: true
  debug_logging: false

schema:
  satellites:
    - name: str
      wyoming_port: port
      output: "list(vban|media_player)?"
      microphone:
        vban_port: port
        vban_mode: "list(unicast|multicast)?"
        multicast_group: "str?"
        stream_name: "str?"
      vban_output:
        enabled: "bool?"
        mode: "list(unicast|multicast)?"
        address: "str?"
        port: "port?"
        stream_name: "str?"
        volume: "float(0.0,2.0)?"
        batch_packets: "int(1,8)?"
      media_player:
        entity: "str?"
        http_port: "port?"
        http_host: "str?"
        mic_mute_tail_ms: "int(0,5000)?"
      followup:
        enabled: "bool?"
        beep: "bool?"
        timeout_s: "int(3,30)?"
      waiting_sounds:
        thinking: "bool?"
        thinking_delay_ms: "int(300,5000)?"
        thinking_file: "str?"
        search: "bool?"
        search_file: "str?"
      camera_phrase:
        enabled: "bool?"
        text: "str?"
        tts_engine: "str?"
        tts_voice: "str?"
  publish_exchanges: "bool?"
  debug_logging: bool
