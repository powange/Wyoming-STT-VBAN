name: "Wyoming VBAN Satellite"
description: "Use VBAN audio sources as Wyoming voice assistant satellites for Home Assistant"
version: "2.14.0"
slug: wyoming-vban-satellite
url: "https://github.com/powange/Wyoming-STT-VBAN"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
homeassistant_api: true
host_network: true
map:
  - config:rw
  - share:ro
options:
  satellites:
    - name: "VBAN Satellite 1"
      wyoming_port: 10700
      vban_receive_port: 6980
      vban_receive_mode: "unicast"
      vban_receive_stream_name: ""
      tts_vban_enabled: false
      tts_vban_mode: "unicast"
      tts_vban_address: ""
      tts_vban_port: 6980
      tts_vban_stream_name: "TTS1"
      tts_vban_volume: 1.0
      tts_vban_batch_packets: 1
      tts_output: "vban"
  publish_exchanges: true
  debug_logging: false

schema:
  satellites:
    - name: str
      wyoming_port: port
      vban_receive_port: port
      vban_receive_mode: "list(unicast|multicast)"
      vban_receive_multicast_group: "str?"
      vban_receive_stream_name: str
      tts_vban_enabled: bool
      tts_vban_mode: "list(unicast|multicast)"
      tts_vban_address: str
      tts_vban_port: port
      tts_vban_stream_name: str
      tts_vban_volume: "float(0.0,2.0)?"
      tts_vban_batch_packets: "int(1,8)?"
      tts_output: "list(vban|media_player)?"
      tts_media_player: "str?"
      tts_http_port: "port?"
      tts_http_host: "str?"
      mic_mute_tail_ms: "int(0,5000)?"
      followup_enabled: "bool?"
      followup_beep: "bool?"
      followup_timeout_s: "int(3,30)?"
      thinking_sound_enabled: "bool?"
      search_sound_enabled: "bool?"
      thinking_delay_ms: "int(300,5000)?"
      thinking_sound: "str?"
      search_sound: "str?"
  publish_exchanges: "bool?"
  debug_logging: bool
