<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VBAN Satellite</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1f2328; --muted: #656d76;
    --border: #d8dee4; --accent: #03a9f4; --accent-text: #ffffff;
    --danger: #d1242f; --ok: #1a7f37; --field: #f6f8fa;
    --section: #f9fafb; --sub: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1c2128; --text: #e6edf3; --muted: #8d96a0;
      --border: #30363d; --accent: #4fc3f7; --accent-text: #0d1117;
      --danger: #f85149; --ok: #3fb950; --field: #0d1117;
      --section: #161b22; --sub: #1c2128;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { padding: 0 16px 32px; }

  /* Header: title, tabs, actions */
  header {
    position: sticky; top: 0; z-index: 3; background: var(--bg);
    border-bottom: 1px solid var(--border); padding: 10px 16px 0; margin: 0 -16px 16px;
  }
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .top h1 { font-size: 20px; margin: 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; margin-top: 8px; }
  .tab {
    border: 0; border-bottom: 3px solid transparent; border-radius: 0;
    background: none; padding: 8px 14px; font-weight: 500; color: var(--muted);
    white-space: nowrap;
  }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .tab .dirty { color: var(--accent); }
  #message { margin: 6px 0 8px; min-height: 1.4em; }
  #message.error { color: var(--danger); }
  #message.ok { color: var(--ok); }

  button {
    font: inherit; border: 1px solid var(--border); background: var(--card);
    color: var(--text); border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  button.small { padding: 2px 10px; font-size: 12px; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 12px;
  }
  .panel { padding: 12px 16px; }

  /* Satellite cards (collapsed by default) */
  details.sat > summary {
    list-style: none; cursor: pointer; padding: 12px 16px;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px;
  }
  details.sat > summary::-webkit-details-marker { display: none; }
  details.sat > summary::before {
    content: "▸"; color: var(--muted); transition: transform .15s; display: inline-block;
  }
  details.sat[open] > summary::before { transform: rotate(90deg); }
  details.sat[open] > summary { border-bottom: 1px solid var(--border); }
  .sat-name { font-size: 16px; font-weight: 600; }
  .sat-info { color: var(--muted); font-size: 13px; }
  .sat-body { padding: 16px; }
  /* Sections flow in as many columns as the width allows */
  .sections { columns: 380px; column-gap: 16px; }
  .sections > * { break-inside: avoid; }
  .general-cards {
    display: grid; gap: 0 12px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr));
  }
  .card-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

  /* Level 1: a section of a satellite (Micro, Sortie…) */
  .sec {
    background: var(--section); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; margin: 0 0 16px; min-width: 0;
  }
  .sec-title {
    font-size: 15px; font-weight: 600; margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .panel > .sec { background: none; border: 0; padding: 0; margin: 0; }
  .grid {
    display: grid; gap: 10px 16px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr));
  }
  .grid > .wide { grid-column: 1 / -1; }
  /* Level 2: a part of a section (each announcement, VBAN fallback…) */
  .sub {
    background: var(--sub); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; margin-top: 10px;
  }
  .sub-title {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    font-weight: 600;
  }
  .sub-title > button { margin-left: auto; }
  .sub .choice { margin-bottom: 8px; }
  .sub .segmented button { padding: 5px 9px; font-size: 13px; }
  /* Announcements: side by side as the width allows */
  .sub-grid {
    display: grid; gap: 10px; align-items: start;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
  }
  .sub-grid > .sub { margin-top: 0; }
  .group-title {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    font-weight: 500; margin-bottom: 6px;
  }
  label { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  /* Level 3: field labels, discreet */
  label span.name { font-size: 12px; font-weight: 500; color: var(--muted); }
  .switch span.name { font-size: 14px; color: var(--text); }
  .help { color: var(--muted); font-size: 12px; }
  .notice { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  input, select {
    font: inherit; padding: 6px 8px; border-radius: 6px; width: 100%;
    border: 1px solid var(--border); background: var(--field); color: var(--text);
  }

  /* Switch (instead of checkboxes) */
  .switch { flex-direction: row; align-items: center; gap: 10px; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch .track {
    flex: none; width: 36px; height: 20px; border-radius: 10px;
    background: var(--border); position: relative; transition: background .15s;
  }
  .switch .track::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; transition: transform .15s;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(16px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Segmented buttons (one choice among a few) */
  .segmented {
    display: inline-flex; flex-wrap: wrap; border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden; max-width: 100%;
  }
  .segmented button {
    border: 0; border-radius: 0; border-right: 1px solid var(--border);
    background: var(--field); padding: 5px 12px;
  }
  .segmented button:last-child { border-right: 0; }
  @media (max-width: 600px) {
    /* Choices wrapped on two lines share the width evenly */
    .segmented { display: flex; width: 100%; }
    .segmented button { flex: 1 1 auto; }
    /* Narrow screens: thinner margins, more room for the fields */
    main { padding: 0 8px 24px; }
    header { padding: 8px 8px 0; margin: 0 -8px 12px; }
    .sat-body { padding: 8px; }
    details.sat > summary { padding: 10px 8px; }
    .sec { padding: 10px 8px; }
    .sub { padding: 8px; }
    .sub .segmented button { padding: 5px 6px; }
  }
  .segmented button[aria-pressed="true"] {
    background: var(--accent); color: var(--accent-text); font-weight: 500;
  }
  .choice {
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin-bottom: 10px;
  }

  /* Debug copies rows */
  .row {
    display: grid; gap: 8px; align-items: end; margin-bottom: 8px;
    grid-template-columns: 2fr 1.4fr 1.4fr 0.8fr 1.2fr auto;
  }
  @media (max-width: 800px) { .row { grid-template-columns: 1fr 1fr; } }

  /* Status tab */
  .status-grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
  }
  .status-sat { padding: 12px 16px; }
  .status-sat h3 { margin: 0 0 6px; font-size: 15px; }
  .status-line { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  /* Level meters: raw microphone, and after clean-up (if on) */
  .meters { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px;
            align-items: center; margin: 8px 0 4px; }
  .meters .label, .meters .value { font-size: 12px; color: var(--muted); }
  .meters .value { min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; }
  .meter { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; }
  .meter > div { height: 100%; background: var(--accent); transition: width .3s; }
  .meter.clean > div { background: var(--ok); }
  .dot { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--danger); }
  .two-cols {
    display: grid; gap: 12px; margin-top: 12px;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr));
  }
  .exchanges { margin: 0; padding: 0; list-style: none; }
  .exchanges li { padding: 6px 0; border-top: 1px solid var(--border); }
  .exchanges li:first-child { border-top: 0; }
  .exchanges .meta { color: var(--muted); font-size: 12px; }
  h2 { font-size: 15px; margin: 0 0 8px; }

  /* Calibration tab */
  .calib { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); align-items: start; }
  .vu { display: grid; grid-template-columns: minmax(110px, auto) 1fr; gap: 6px 12px; align-items: center; margin: 8px 0; }
  .vu .bar { position: relative; height: 14px; border-radius: 4px; background: var(--border); overflow: hidden; }
  .vu .bar > .rms { height: 100%; background: var(--accent); transition: width .08s; }
  .vu .bar > .rms.after { background: var(--ok); }
  .vu .bar > .peak { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text); }
  .vu .bar > .target { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--muted); opacity: .7; }
  .vu .bar.clipping { box-shadow: 0 0 0 2px var(--danger); }
  .vu .nums { grid-column: 2; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: -4px; }
  .steps { display: grid; gap: 10px; }
  .phrase { font-size: 17px; line-height: 1.5; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--section); border-radius: 4px; }
  .results { width: 100%; border-collapse: collapse; margin: 8px 0; }
  .results td { padding: 4px 0; border-bottom: 1px solid var(--border); }
  .results td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
  .advice { margin: 8px 0 0; padding-left: 18px; }
  .advice li { margin: 4px 0; }
  .countdown { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--accent); }
  .row-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .levels { width: 100%; border-collapse: collapse; margin: 8px 0; font-variant-numeric: tabular-nums; }
  .levels th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 4px 6px 4px 0; }
  .levels td { padding: 4px 6px 4px 0; border-top: 1px solid var(--border); }
  .levels tr.recommended td { font-weight: 600; }
  .levels .warn { color: var(--danger); }
  .levels button { padding: 2px 8px; }
  .levels-wrap { overflow-x: auto; }
  label.inline { display: inline-flex; flex-direction: row; align-items: center; gap: 4px; margin: 0; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 8px; background: var(--accent); color: #fff; margin-left: 6px; font-weight: 500; }
  .ha-driven { display: grid; gap: 4px; padding: 8px 10px; border-radius: 6px; background: var(--section); }
  .ha-driven .vals { font-variant-numeric: tabular-nums; }
  .wake-score { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <header>
    <div class="top">
      <h1>VBAN Satellite <span id="version" class="help"></span></h1>
      <div class="actions" id="actions">
        <button id="export">Exporter</button>
        <button id="import">Importer</button>
        <input id="import-file" type="file" accept=".yaml,.yml,text/yaml" hidden>
        <button id="revert" disabled>Annuler les modifications</button>
        <button id="save" class="primary" disabled>Enregistrer et appliquer</button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="status">État</button>
      <button class="tab" role="tab" data-tab="satellites">Satellites</button>
      <button class="tab" role="tab" data-tab="calibration">Calibrage</button>
      <button class="tab" role="tab" data-tab="general">Général</button>
    </nav>
    <p id="message" role="status"></p>
  </header>
  <section id="tab-status" role="tabpanel"></section>
  <section id="tab-satellites" role="tabpanel" hidden></section>
  <section id="tab-calibration" role="tabpanel" hidden></section>
  <section id="tab-general" role="tabpanel" hidden></section>
</main>
<script>
"use strict";

const MODES = [["none", "Aucun"], ["sound", "Son"], ["phrase", "Phrase"],
               ["sound_then_phrase", "Son + phrase"]];
const BLOCKS = ["microphone", "vban_output", "media_player", "followup",
                "waiting_sounds", "camera_phrase"];
// Before 3.2, booleans switched announcements on/off; they set the mode when
// it isn't set (on = sound, off = none)
const LEGACY = [
  ["waiting_sounds", "thinking_mode", "thinking", "sound", "phrase"],
  ["waiting_sounds", "search_mode", "search", "sound", "sound_then_phrase"],
  ["camera_phrase", "mode", "enabled", "phrase", "phrase"],
];

let saved = null;   // options as stored by the Supervisor
let options = null; // options being edited
let currentTab = "satellites";
const openSatellites = new Set(); // indexes of expanded satellite cards

const panels = {
  calibration: document.getElementById("tab-calibration"),
  status: document.getElementById("tab-status"),
  satellites: document.getElementById("tab-satellites"),
  general: document.getElementById("tab-general"),
};
const saveButton = document.getElementById("save");
const revertButton = document.getElementById("revert");
const message = document.getElementById("message");

function say(text, kind = "") {
  message.textContent = text;
  message.className = kind;
}

function isDirty() {
  return options !== null && JSON.stringify(options) !== JSON.stringify(saved);
}

function setDirty() {
  const dirty = isDirty();
  saveButton.disabled = !dirty;
  revertButton.disabled = !dirty;
  for (const tab of document.querySelectorAll(".tab")) {
    const name = tab.dataset.tab;
    const label = { status: "État", satellites: "Satellites", calibration: "Calibrage",
                    general: "Général" }[name];
    const marked = dirty && (name === "satellites" || name === "general");
    tab.replaceChildren(label, marked ? el("span", { class: "dirty" }, " •") : "");
  }
  if (dirty) say("Modifications non enregistrées.");
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value !== undefined && value !== null && value !== false) node.setAttribute(key, value);
  }
  for (const child of children.flat(Infinity)) {
    if (child !== null && child !== undefined && child !== false && child !== "") {
      node.append(child);
    }
  }
  return node;
}

function changed(rerender = false) {
  setDirty();
  if (rerender) renderConfig();
}

/* A form field bound to obj[key]. An empty optional field is removed from
   the options, so the default applies. */
function field(obj, key, spec) {
  const { label, type = "text", choices, help, placeholder, def, rerender,
          required, min, max, step, wide } = spec;
  const set = (value) => {
    if (value === undefined) delete obj[key];
    else obj[key] = value;
    changed(rerender);
  };
  if (type === "switch") {
    const input = el("input", { type: "checkbox", role: "switch" });
    input.checked = key in obj ? !!obj[key] : !!def;
    input.addEventListener("change", () => set(input.checked));
    return el("label", { class: `switch${wide ? " wide" : ""}` }, input,
              el("span", { class: "track" }),
              el("span", {}, el("span", { class: "name" }, label),
                 help ? el("span", { class: "help" }, ` — ${help}`) : null));
  }
  let input;
  if (type === "select") {
    input = el("select", {}, choices.map(([value, text]) => el("option", { value }, text)));
    input.value = key in obj ? obj[key] : def;
    input.addEventListener("change", () => set(input.value));
  } else {
    // Numbers as text with a decimal keyboard: "0,5" works too (a number
    // field gives "" for it in some browsers, which erased the value)
    input = type === "number"
      ? el("input", { type: "text", inputmode: "decimal", placeholder,
                      required: required ? "" : null, "data-min": min, "data-max": max })
      : el("input", { type, placeholder, required: required ? "" : null });
    input.value = key in obj ? obj[key] : "";
    input.addEventListener("input", () => {
      const raw = input.value.trim();
      if (raw === "") set(required ? obj[key] : undefined);
      else if (type === "number") {
        const number = Number(raw.replace(",", "."));
        if (!Number.isNaN(number)) set(number);
      } else set(input.value);
    });
  }
  return el("label", { class: wide ? "wide" : "" }, el("span", { class: "name" }, label), input,
            help ? el("span", { class: "help" }, help) : null);
}

/* Segmented buttons: one choice among a few; onPick(value) applies it. */
function segmented(label, value, choices, onPick, help) {
  return el("div", { class: "choice" },
    label ? el("span", { class: "name" }, label) : null,
    el("div", { class: "segmented", role: "group" },
      choices.map(([choice, text]) => el("button", {
        type: "button", "aria-pressed": String(choice === value),
        onclick: () => { if (choice !== value) onPick(choice); },
      }, text))),
    help ? el("span", { class: "help" }, help) : null);
}

function section(title, extra, ...content) {
  return el("div", { class: "sec" }, el("div", { class: "sec-title" }, title, extra), ...content);
}

const grid = (...fields) => el("div", { class: "grid" }, fields);

/* A titled part of a section (one per announcement), with an optional
   test button on its title line. */
function group(title, test, ...content) {
  return el("div", { class: "sub" }, el("div", { class: "sub-title" }, title, test), ...content);
}

/* Effective announcement mode, considering the pre-3.2 booleans. */
function effectiveMode(block, modeKey, legacyKey, on, def) {
  if (block[modeKey]) return block[modeKey];
  if (legacyKey in block) return block[legacyKey] ? on : "none";
  return def;
}

function modeChoice(block, modeKey, legacyKey, on, def, help) {
  const mode = effectiveMode(block, modeKey, legacyKey, on, def);
  return segmented(null, mode, MODES, (value) => {
    block[modeKey] = value;
    delete block[legacyKey];
    changed(true);
  }, help);
}

const hasSound = (mode) => mode === "sound" || mode === "sound_then_phrase";
const hasPhrase = (mode) => mode === "phrase" || mode === "sound_then_phrase";

/* Where responses are played; "vban" with the VBAN output off plays
   nothing, so it shows as "none". */
function effectiveOutput(sat) {
  const output = sat.output || "vban";
  return output === "vban" && !sat.vban_output.enabled ? "none" : output;
}

/* Plays a signal with the saved (running) configuration. */
function testButton(sat, signal) {
  return el("button", { class: "small", type: "button", title: "Jouer sur la sortie du satellite",
    onclick: async (event) => {
      const button = event.currentTarget;
      if (isDirty()) {
        say("Le test utilise la configuration enregistrée : enregistrez d'abord vos modifications.");
      }
      const name = sat.name;
      button.disabled = true;
      try {
        const resp = await fetch("api/test", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ satellite: name, signal }),
        });
        const body = await resp.json();
        if (!resp.ok) {
          say(body.error === "Unknown satellite"
              ? `« ${name} » ne tourne pas encore : enregistrez d'abord.`
              : body.error || `Erreur ${resp.status}`, "error");
        } else if (!body.played.length) say("Rien à jouer (désactivé, ou pas de sortie).");
        else say(`Joué : ${body.played.join(", ")}.`, "ok");
      } catch (err) {
        say(`Erreur : ${err}`, "error");
      } finally {
        button.disabled = false;
      }
    } }, "▶ Tester");
}

function vbanOutputFields(vban) {
  return grid(
    field(vban, "address", { label: "Adresse de l'enceinte", required: true,
          placeholder: "192.168.0.179" }),
    field(vban, "stream_name", { label: "Nom du flux", placeholder: "TTS1" }),
    field(vban, "port", { label: "Port", type: "number", placeholder: "6980" }),
    field(vban, "volume", { label: "Volume", type: "number", min: 0, max: 2, step: 0.05,
          placeholder: "1.0", help: "0 à 2" }),
    field(vban, "batch_packets", { label: "Paquets par envoi", type: "number", min: 1, max: 8,
          placeholder: "1", help: "1 = le plus régulier" }),
    field(vban, "mode", { label: "Mode", type: "select", def: "unicast",
          choices: [["unicast", "Unicast"], ["multicast", "Multicast"]] }));
}

function outputSection(sat, index) {
  const vban = sat.vban_output, mp = sat.media_player;
  const output = effectiveOutput(sat);
  const pick = (value) => {
    sat.output = value;
    if (value === "vban") vban.enabled = true;
    changed(true);
  };
  return section("Sortie des réponses", null,
    segmented(null, output, [["vban", "VBAN"], ["media_player", "Media player"],
                             ["none", "Aucune"]], pick),
    output === "vban" && vbanOutputFields(vban),
    output === "media_player" && [
      grid(
        field(mp, "entity", { label: "Entité", required: true,
              placeholder: "media_player.nestmini7039" }),
        field(mp, "mic_mute_tail_ms", { label: "Marge de coupure micro (ms)", type: "number",
              min: 0, max: 5000, placeholder: "250" }),
        field(mp, "http_port", { label: "Port HTTP", type: "number",
              placeholder: String(10800 + index) }),

const NOISE_NAMES = { off: "Aucune", light: "Légère", medium: "Moyenne", strong: "Forte" };

/* Microphone settings applied to a satellite, as the status reports them. */
function micSettingsText(settings) {
  if (!settings) return "—";
  const gain = settings.auto_gain ? `gain auto ${settings.auto_gain_target_db.toFixed(0)} dBFS`
                                  : "gain auto désactivé";
  return `volume ${settings.volume.toFixed(2)} · ${gain} · réduction de bruit ` +
         `${(NOISE_NAMES[settings.noise_suppression] || settings.noise_suppression).toLowerCase()}`;
}

function haSyncText(sat) {
  const ha = sat?.ha_mic;
  if (!ha) return "en attente de Home Assistant";
  if (!Object.keys(ha.entities || {}).length) return "entités introuvables dans Home Assistant (réglages de l'app utilisés)";
  if (!ha.synced_at) return "valeurs pas encore lues (réglages de l'app utilisés)";
  return `dernière synchronisation ${new Date(ha.synced_at * 1000).toLocaleTimeString("fr-FR")}`;
}

/* Fill the "driven by Home Assistant" boxes without re-rendering the form. */

  for (const box of document.querySelectorAll("[data-ha-mic]")) {

    box.querySelector(".vals").textContent = following ? micSettingsText(sat.mic_settings) : "—";
    box.querySelector(".help").textContent = !sat ? "satellite pas encore démarré"
      : following ? haSyncText(sat) : "enregistrez pour suivre les entités Home Assistant";

/* Explicit modes instead of the pre-3.2 booleans. */
function forSave(opts) {
  const copy = JSON.parse(JSON.stringify(opts));
  for (const sat of copy.satellites) {
    for (const [block, modeKey, legacyKey, on, def] of LEGACY) {
      const b = sat[block];
      if (b && legacyKey in b) {
        b[modeKey] = effectiveMode(b, modeKey, legacyKey, on, def);
        delete b[legacyKey];
      }
    }
  }
  return copy;
}

    .replace(/^satellite '(.*)' added$/, "« $1 » ajouté")
    .replace(/^satellite '(.*)' removed$/, "« $1 » supprimé");
}

/* Status tab */

function dot(state) {
  return el("span", { class: `dot ${state === true ? "on" : state === false ? "off" : ""}` });
}

/* Noise floor and loudest moment over the last 10 s: the gap between a
   voice and the background matters more than the levels themselves. */
function levelStats(sat) {
  if (sat.noise_floor_db === null || sat.last_packet_s === null || sat.last_packet_s > 2) {
    return null;
  }
  const db = (value) => `${value.toFixed(0)} dB`;
  const gap = sat.peak_db - sat.noise_floor_db;
  const cleanFloor = sat.filtered_noise_floor_db !== null && sat.filtered_noise_floor_db !== undefined
    ? ` (nettoyé ${db(sat.filtered_noise_floor_db)})` : "";
  return el("div", { class: "help" },
    `10 dernières s : bruit de fond ${db(sat.noise_floor_db)}${cleanFloor} · pic ${db(sat.peak_db)} · écart ${gap.toFixed(0)} dB`,
    sat.dc_offset_db > -40
      ? el("div", {}, `décalage continu ${db(sat.dc_offset_db)} (inaudible, retiré)`)
      : null);
}

/* One level meter row: label, bar (-70 dB to 0 dB), value. */
function meterRow(label, level, clean = false) {
  const width = level === null ? 0 : Math.max(0, Math.min(100, (level + 70) / 70 * 100));
  return [
    el("span", { class: "label" }, label),
    el("div", { class: clean ? "meter clean" : "meter" }, el("div", { style: `width: ${width}%` })),
    el("span", { class: "value" }, level === null ? "—" : `${level.toFixed(0)} dB`),
  ];
}

function renderStatus(status) {
  const cards = status.satellites.map((sat) => {
    const receiving = sat.last_packet_s !== null && sat.last_packet_s <= 2;
    const audio = sat.last_packet_s === null ? "aucun audio reçu · "
      : !receiving ? `plus d'audio depuis ${Math.round(sat.last_packet_s)} s · ` : "";
    const cleaned = sat.filtered_level_db !== null && sat.filtered_level_db !== undefined;
    const out = { vban: "VBAN", media_player: "media player", none: "aucune" }[sat.output] || sat.output;
    return el("div", { class: "card status-sat" },
      el("h3", {}, sat.name),
      el("div", { class: "status-line" }, dot(sat.ha_connected),
         sat.ha_connected ? (sat.streaming ? "Home Assistant : écoute" : "Home Assistant : connecté")
                          : sat.running ? "Home Assistant : non connecté" : "arrêté"),
      el("div", { class: "meters" },
        meterRow(cleaned ? "Brut" : "Micro", receiving ? sat.mic_level_db : null),
        cleaned && meterRow("Nettoyé", receiving ? sat.filtered_level_db : null, true)),
      el("div", { class: "help" }, `${audio}sortie ${out}`),
      sat.mic_settings && el("div", { class: "help" },
        `Réglages micro (${sat.mic_settings.source === "home_assistant" ? "Home Assistant" : "app"}) : ` +
        micSettingsText(sat.mic_settings),
        sat.mic_settings.source === "home_assistant" ? ` — ${haSyncText(sat)}` : ""),
      sat.filter_bypassed && el("div", { class: "status-line" }, dot(false),
        "Nettoyage contourné : il rendait le micro muet (son brut envoyé, voir le journal)"),
      levelStats(sat));
  });
  const phrases = status.phrases.map((p) =>
    el("div", { class: "status-line help" }, dot(p.ready),
       `« ${p.text} » ${p.ready ? "prête" : "en synthèse…"}`));
  const exchanges = status.exchanges.slice(0, 15).map((x) =>
    el("li", {},
      el("div", { class: "meta" },
         new Date(x.time * 1000).toLocaleTimeString("fr-FR"), " · ", x.satellite,
         x.followup ? " · relance" : ""),
      `« ${x.transcript} » → « ${x.response} »`));
  panels.status.replaceChildren(
    el("div", { class: "status-grid" }, cards),
    el("div", { class: "two-cols" },
      el("div", { class: "card panel" },
        el("h2", {}, "Derniers échanges"),
        exchanges.length ? el("ul", { class: "exchanges" }, exchanges)
                         : el("p", { class: "help" }, "Aucun pour l'instant.")),
      el("div", { class: "card panel" },
        el("h2", {}, "Home Assistant"),
        el("div", { class: "status-line" }, dot(status.ha_websocket),
           status.ha_websocket === null ? "Connexion : non utilisée"
           : status.ha_websocket ? "Connexion : établie" : "Connexion : coupée"),
        phrases.length ? [el("h2", { style: "margin-top: 12px" }, "Phrases des annonces"), phrases]
                       : null)));
}

async function refreshStatus() {
  const haDriven = currentTab === "satellites" && document.querySelector("[data-ha-mic]");
  if (currentTab !== "status" && !haDriven) return;
  try {
    const resp = await fetch("api/status");
    if (!resp.ok) return;
    lastStatus = await resp.json();
    if (currentTab === "status") renderStatus(lastStatus);
    fillHaDriven();
  } catch (err) {
    if (currentTab === "status") panels.status.textContent = `État indisponible : ${err}`;
  }

/* Calibration tab */

const CALIB_PHRASE = "Dis-moi Jarvis, allume la lumière du salon, règle le chauffage à vingt " +
                     "degrés, puis dis-moi quel temps il fera demain matin.";
const WAKE_PHRASE = "Dis-moi Jarvis";
const STEP_SECONDS = { noise: 5, voice: 8, near: 6, far: 6, wake: 20 };
const STEP_LABELS = {
  noise: "Silence, mesure en cours…", voice: "Lisez la phrase…",
  near: "Près du micro (≈ 50 cm), lisez la phrase…",
  far: "À votre place habituelle ou loin (≈ 3 m), lisez la phrase…",
  wake: `Dites « ${WAKE_PHRASE} » 5 fois, en marquant une pause entre chaque…`,
};
const calib = { satellite: null, source: null, poll: null, busy: false, audio: null,
                generation: 0 }; // generation: bumped when the calibration is closed

/* Forget the results (steps from `from` on: noise, voice, denoise, autogain, wake). */
function resetCalib(from = "noise") {
  const order = ["noise", "voice", "denoise", "autogain", "wake"];
  const i = order.indexOf(from);
  if (i <= 0) { calib.noise = null; calib.applied = {}; }
  if (i <= 1) { calib.result = null; delete calib.applied.volume; }
  if (i <= 2) { calib.denoise = null; calib.noiseChoice = null; delete calib.applied.noise_suppression; }
  if (i <= 3) { calib.takes = {}; calib.autogain = null; delete calib.applied.auto_gain; }
  calib.wake = null;
}
resetCalib();

function calibSat() {
  return (saved?.satellites || []).find((s) => s.name === calib.satellite);
}

const followsHa = () => !!calibSat()?.microphone?.follow_ha_entities;

async function postJson(url, body) {
  const resp = await fetch(url, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ satellite: calib.satellite, ...body }),
  });
  let data = {};
  try { data = await resp.json(); } catch (err) { /* empty answer */ }
  if (!resp.ok) {
    const error = new Error(data.error || `Erreur ${resp.status}`);
    error.expired = !!data.expired;
    throw error;
  }
  return data;
}

function vuRow(label, stats, after) {
  const pos = (db) => Math.max(0, Math.min(100, (db + 70) / 70 * 100));
  const rms = stats ? pos(stats.rms_db) : 0;
  const peak = stats ? pos(stats.peak_db) : 0;
  const clipping = stats && stats.clip_pct > 0;
  return [
    el("span", { class: "name" }, label),
    el("div", { class: `bar${clipping ? " clipping" : ""}` },
      el("div", { class: `rms${after ? " after" : ""}`, style: `width: ${rms}%` }),
      el("div", { class: "target", style: `left: ${pos(-20)}%`, title: "cible voix −20 dBFS" }),
      stats && el("div", { class: "peak", style: `left: calc(${peak}% - 1px)` })),
    el("span", { class: "nums" }, stats
      ? `RMS ${stats.rms_db.toFixed(0)} dBFS · crête ${stats.peak_db.toFixed(0)} dBFS · écrêtage ${stats.clip_pct.toFixed(1)} %`
      : after ? "pas de mesure (Home Assistant n'écoute pas ce satellite)" : "aucun audio reçu"),
  ];
}

}

function stopMeter() {
  if (calib.source) { calib.source.close(); calib.source = null; }
  if (calib.poll) { clearTimeout(calib.poll); calib.poll = null; }
}

function startMeter() {
  stopMeter();
  if (!calib.satellite) return;
  const query = `satellite=${encodeURIComponent(calib.satellite)}`;
  // Fallback polling: the next request only once the previous one has
  // answered (a fixed interval piles requests up over a slow Ingress)
  const poll = () => {
    calib.poll = setTimeout(async () => {
      try {
        const resp = await fetch(`api/meter/once?${query}`);
        if (resp.ok) renderVu(await resp.json());
        else if (resp.status >= 400 && resp.status < 500) {
          stopMeter(); // e.g. saved but not running: no point asking again
          const box = document.getElementById("calib-vu");
          if (box) box.replaceChildren(el("p", { class: "help" },
            "Ce satellite ne tourne pas : enregistrez la configuration ou consultez le journal."));
          return;
        }
      } catch (err) { /* next tick */ }
      if (calib.poll) poll();
    }, 100);
  };
  if (window.EventSource) {
    calib.source = new EventSource(`api/meter?${query}`);
    calib.source.onmessage = (event) => renderVu(JSON.parse(event.data));
    calib.source.onerror = () => { stopMeter(); poll(); }; // e.g. proxy buffering
  } else {
    poll();
  }
}

async function clearRecordings() {
  if (calib.audio) { calib.audio.pause(); calib.audio = null; }
  if (calib.satellite && (calib.noise || calib.result)) {
    try {
      await fetch(`api/calibration?satellite=${encodeURIComponent(calib.satellite)}`,
                  { method: "DELETE" });
    } catch (err) { /* expires anyway */ }
  }
  resetCalib();
}

function closeCalibration() {
  stopMeter();
  calib.generation += 1; // a measure still running is ignored when it ends
  calib.busy = false;
  clearRecordings();
}

function openCalibration() {
  const names = (saved?.satellites || []).map((s) => s.name);
  if (!names.includes(calib.satellite)) calib.satellite = names[0] || null;
  renderCalibration();
  startMeter();
}

async function countdown(seconds, label, stopped = () => false) {
  for (let left = seconds; left > 0 && !stopped(); left--) {
    const box = document.getElementById("calib-progress");
    if (box) box.replaceChildren(label, " ", el("span", { class: "countdown" }, `${left} s`));
    await new Promise((resolve) => setTimeout(resolve, 1000));
  }
  const box = document.getElementById("calib-progress");
  if (box && !stopped()) box.textContent = "Analyse…";
}

/* The settings proposed so far (volume, then steps A and B). */
function proposedSettings() {
  const settings = {};
  if (calib.result) settings.volume = calib.result.proposal.volume;
  if (calib.noiseChoice) settings.noise_suppression = calib.noiseChoice;
  if (calib.autogain) {
    settings.auto_gain = calib.autogain.auto_gain;
    if (calib.autogain.auto_gain) settings.auto_gain_target_db = calib.autogain.target_db;
  }
  return settings;
}

async function busy(task) {
  const generation = calib.generation;
  calib.busy = true;
  renderCalibration();
  try {
    await task(() => calib.generation !== generation);
  } catch (err) {
    if (calib.generation === generation) {
      say(err.message || `Erreur : ${err}`, "error");
      if (err.expired) resetCalib(); // the server forgot it: start again
    }
  }
  if (calib.generation !== generation) return; // closed meanwhile
  calib.busy = false;
  renderCalibration();
}

function recordStep(step) {
  return busy(async (closed) => {
    const extra = {};
    if (step === "near" || step === "far") extra.noise_suppression = calib.noiseChoice;
    if (step === "wake") {
      // The model is checked before asking to speak
      await loadWakeModels();
      if (!calib.models || !calib.models.includes(calib.model)) {
        throw new Error(calib.modelsError || `Modèle « ${calib.model} » absent d'openWakeWord`);
      }
      Object.assign(extra, { model: calib.model, proposed: proposedSettings() });
    }
    let failed = false;
    const request = postJson("api/calibration/record", { step, ...extra });
    request.catch(() => { failed = true; }); // stops the countdown at once
    await countdown(STEP_SECONDS[step], STEP_LABELS[step], () => failed || closed());
    const body = await request;
    if (closed()) return;
    say("");
    if (step === "noise") {
      resetCalib("voice");
      calib.noise = body.noise;
    } else if (step === "voice") {
      resetCalib("voice");
      calib.result = body;
      await runDenoise();
      loadWakeModels();
    } else if (step === "wake") {
      calib.wake = body;
    } else {
      calib.takes[step] = body.voice_db;
      calib.autogain = null;
      if (calib.takes.near !== undefined && calib.takes.far !== undefined) await runAutogain();
    }
  });
}

/* Step A: the voice take through each noise suppression level. */
async function runDenoise() {
  calib.denoise = await postJson("api/calibration/denoise", {});
  calib.noiseChoice = calib.denoise.recommended;
}

/* Step B: decision from the near and far takes (with the level of step A). */
async function runAutogain() {
  calib.autogain = await postJson("api/calibration/autogain",
                                  { noise_suppression: calib.noiseChoice });
}

async function pickNoise(level) {
  calib.noiseChoice = level;
  // Once B is applied its takes are deleted: nothing to recompute
  if (calib.autogain && !("auto_gain" in calib.applied)) await busy(runAutogain);
  else renderCalibration();
}

async function loadWakeModels() {
  calib.models = null;
  calib.modelsError = null;
  try {
    const resp = await fetch("api/calibration/wake_models");
    const body = await resp.json();
    if (!resp.ok) throw new Error(body.error || `Erreur ${resp.status}`);
    calib.models = body.models;
    if (!calib.model || !body.models.includes(calib.model)) {
      calib.model = body.models.includes(body.default) ? body.default : body.models[0] || body.default;
    }
  } catch (err) {
    calib.modelsError = err.message;
  }
  renderCalibration();
}

function play(which) {
  if (calib.audio) calib.audio.pause();
  calib.audio = new Audio(`api/calibration/audio?satellite=${encodeURIComponent(calib.satellite)}` +
                          `&which=${which}&t=${Date.now()}`);
  calib.audio.play().catch((err) => say(`Lecture impossible : ${err}`, "error"));
}

const playButton = (which, text) =>
  el("button", { type: "button", onclick: () => play(which) }, `▶ ${text}`);

/* Apply settings (one step, or all with finish): written to the HA
   entities if the satellite follows them, otherwise to the app's options. */
function applySettings(values, finish = false) {
  return busy(async () => {
    const ha = followsHa();
    say(ha ? "Écriture dans Home Assistant…" : "Enregistrement et application…");
    await postJson("api/calibration/apply", { ...values, finish });
    for (const [key, value] of Object.entries(values)) calib.applied[key] = value;
    if (finish) resetCalib();
    if (!ha) {
      // Saved: put the same values in the editor, keeping its other
      // unsaved changes (a reload would drop them)
      for (const opts of [saved, options]) {
        const sat = (opts?.satellites || []).find((s) => s.name === calib.satellite);
        if (!sat) continue;
        sat.microphone = sat.microphone || {};
        for (const [key, value] of Object.entries(values)) {
          if (value !== null && value !== undefined) sat.microphone[key] = value;
        }
      }
      renderConfig();
      setDirty();
    }
    say((ha ? "Écrit dans les entités Home Assistant du satellite ; l'app l'applique dès que Home Assistant le confirme."
            : "Enregistré et appliqué sans redémarrage.") +
        (finish ? " Enregistrements effacés." : ""), "ok");
  });
}

const dbfs = (value) => (value === null || value === undefined ? "—" : `${value.toFixed(0)} dBFS`);
const gainText = (on, target) => (on ? `activé, cible ${target.toFixed(0)} dBFS` : "désactivé");

function resultsCard() {
  const r = calib.result;
  if (!r) return null;
  const p = r.proposal;
  const row = (label, value) => el("tr", {}, el("td", {}, label), el("td", {}, value));
  return el("div", { class: "card panel" },
    el("h2", {}, "Volume du micro"),
    el("table", { class: "results" },
      row("Bruit de fond", dbfs(r.noise.rms_db)),
      row("Voix (passages parlés)", dbfs(r.voice.rms_db)),
      row("Crête de la voix", dbfs(r.voice.peak_db)),
      row("Écrêtage à l'arrivée", `${r.voice.clip_pct.toFixed(2)} %`),
      row("Rapport signal/bruit", `${p.snr_db.toFixed(0)} dB`),
      row("Volume du micro proposé", `${p.volume.toFixed(2)} (${p.gain_db >= 0 ? "+" : ""}${p.gain_db.toFixed(1)} dB)`),
      row("Voix après", dbfs(p.voice_after_db)),
      row("Crête après", dbfs(p.peak_after_db)),
      row("Bruit de fond après", dbfs(p.noise_after_db))),
    p.advice.length
      ? el("ul", { class: "advice" }, p.advice.map((text) => el("li", {}, text)))
      : el("p", { class: "help" }, "Niveaux corrects : aucun réglage à faire côté appareil."),
    el("div", { class: "row-buttons" },
      !("noise_suppression" in calib.applied) && playButton("before", "Écouter avant"),
      !("volume" in calib.applied) && playButton("after", "Écouter après (volume proposé)"),
      el("button", { type: "button", class: "primary", disabled: calib.busy || null,
                     onclick: () => applySettings({ volume: p.volume }) },
         calib.applied.volume === p.volume ? `Volume ${p.volume.toFixed(2)} appliqué ✓`
                                           : `Appliquer le volume ${p.volume.toFixed(2)}`)));
}

function denoiseStep() {
  const d = calib.denoise;
  if (!d) return el("p", { class: "help" }, "Après la mesure de la voix : la phrase est rejouée à travers chaque niveau, avec le volume proposé.");
  const rows = d.rows.map((r) => el("tr", { class: r.level === d.recommended ? "recommended" : "" },
    el("td", {}, el("label", { class: "inline" },
      el("input", { type: "radio", name: "noise-level", checked: r.level === calib.noiseChoice || null,
                    disabled: calib.busy || null, onchange: () => pickNoise(r.level) }),
      " ", NOISE_NAMES[r.level],
      r.level === d.recommended ? el("span", { class: "pill" }, "recommandé") : null)),
    el("td", {}, dbfs(r.noise_db)),
    el("td", { class: r.eats_voice ? "warn" : "" }, dbfs(r.voice_db),
       r.voice_loss_db > 0.5 ? ` (−${r.voice_loss_db.toFixed(0)} dB)` : ""),
    el("td", {}, r.snr_db === null ? "—" : `${r.snr_db.toFixed(0)} dB`),
    el("td", {}, "noise_suppression" in calib.applied ? "" : el("button", { type: "button",
       title: `Écouter : ${NOISE_NAMES[r.level]}`, onclick: () => play(`denoise-${r.level}`) }, "▶"))));
  return [
    el("div", { class: "levels-wrap" }, el("table", { class: "levels" },
      el("tr", {}, ["Niveau", "Bruit restant", "Voix", "Voix/bruit", ""].map((h) => el("th", {}, h))),
      rows)),
    d.advice.length ? el("ul", { class: "advice" }, d.advice.map((t) => el("li", {}, t))) : null,
    el("div", { class: "row-buttons" },
      el("button", { type: "button", class: "primary", disabled: calib.busy || null,
                     onclick: () => applySettings({ noise_suppression: calib.noiseChoice }) },
         calib.applied.noise_suppression === calib.noiseChoice ? "Réduction de bruit appliquée ✓"
           : `Appliquer : ${NOISE_NAMES[calib.noiseChoice]}`)),
  ];
}

function autogainStep() {
  const disabled = calib.busy || !calib.result;
  const take = (step, label) => el("button", { type: "button", disabled: disabled || null,
    onclick: () => recordStep(step) },
    calib.takes[step] !== undefined ? `${label} : ${dbfs(calib.takes[step])} (refaire)` : `${label} (6 s)`);
  const g = calib.autogain;
  return [
    el("p", { class: "help" }, "Deux prises de la même phrase, d'une voix normale : près du micro (≈ 50 cm), puis à votre place habituelle ou loin (≈ 3 m)."),
    el("div", { class: "row-buttons" }, take("near", "Prise proche"), take("far", "Prise lointaine")),
    g && [
      el("table", { class: "results" },
        el("tr", {}, el("td", {}, "Voix proche"), el("td", {}, dbfs(g.near_db))),
        el("tr", {}, el("td", {}, "Voix lointaine"), el("td", {}, dbfs(g.far_db))),
        el("tr", {}, el("td", {}, "Écart"), el("td", {}, `${g.gap_db.toFixed(0)} dB`)),
        el("tr", {}, el("td", {}, "Gain automatique proposé"), el("td", {}, gainText(g.auto_gain, g.target_db)))),
      el("p", { class: "help" }, g.auto_gain
        ? "La voix varie beaucoup avec la distance : le gain automatique la ramène au niveau de la prise proche."
        : "La voix varie peu avec la distance : le volume fixe suffit."),
      g.advice.length ? el("ul", { class: "advice" }, g.advice.map((t) => el("li", {}, t))) : null,
      !("auto_gain" in calib.applied) && el("div", { class: "row-buttons" },
        playButton("near-before", "Proche, avant"), playButton("near-after", "Proche, avec gain auto"),
        playButton("far-before", "Loin, avant"), playButton("far-after", "Loin, avec gain auto")),
      el("div", { class: "row-buttons" },
        el("button", { type: "button", class: "primary", disabled: calib.busy || null,
                       onclick: () => applySettings({ auto_gain: g.auto_gain,
                         auto_gain_target_db: g.auto_gain ? g.target_db : null }) },
           "auto_gain" in calib.applied ? "Gain automatique appliqué ✓"
             : `Appliquer : gain auto ${gainText(g.auto_gain, g.target_db)}`))],
  ];
}

function wakeStep() {
  const w = calib.wake;
  const disabled = calib.busy || !calib.result || !calib.models;
  const score = (label, part) => el("div", {},
    el("div", { class: "help" }, label),
    el("div", { class: "wake-score" }, `${part.detections}/${w.expected}`),
    el("div", { class: "help" }, micSettingsText(part)));
  const models = calib.models
    ? el("label", {}, el("span", { class: "name" }, "Modèle"), (() => {
        const select = el("select", { disabled: calib.busy || null },
          calib.models.map((m) => el("option", { value: m }, m)));
        select.value = calib.model;
        select.addEventListener("change", () => { calib.model = select.value; });
        return select;
      })())
    : el("p", { class: "help" }, calib.modelsError
        ? `openWakeWord : ${calib.modelsError}`
        : calib.result ? "Recherche d'openWakeWord…" : "Après la mesure de la voix.");
  return [
    el("p", { class: "help" },
      `À votre place habituelle, dites « ${WAKE_PHRASE} » 5 fois en 20 secondes. Le son, traité avec ` +
      "les réglages actuels puis avec les réglages proposés, est envoyé directement à openWakeWord, " +
      "sans passer par Home Assistant : Jarvis ne se déclenche pas."),
    models,
    el("div", { class: "row-buttons" },
      el("button", { type: "button", disabled: disabled || null, onclick: () => recordStep("wake") },
         w ? "Refaire le test (20 s)" : "Tester le mot-clé (20 s)")),
    w && [
      el("div", { class: "grid" }, score("Réglages actuels", w.current), score("Réglages proposés", w.proposed)),
      el("p", { class: "help" }, "openWakeWord ne donne pas de score de confiance : seul le nombre de détections est indiqué."),
    ],
  ];
}

function summaryCard() {
  if (!calib.result) return null;
  const p = proposedSettings();
  const w = calib.wake;
  const row = (label, value) => el("tr", {}, el("td", {}, label), el("td", {}, value));
  const values = { volume: p.volume };
  if (p.noise_suppression) values.noise_suppression = p.noise_suppression;
  if (p.auto_gain !== undefined) {
    values.auto_gain = p.auto_gain;
    values.auto_gain_target_db = p.auto_gain_target_db ?? null;
  }
  return el("div", { class: "card panel" },
    el("h2", {}, "Récapitulatif"),
    el("table", { class: "results" },
      row("Volume du micro", p.volume.toFixed(2)),
      row("Réduction de bruit", p.noise_suppression ? NOISE_NAMES[p.noise_suppression] : "étape A à faire"),
      row("Gain automatique", p.auto_gain === undefined ? "étape B à faire"
                                : gainText(p.auto_gain, p.auto_gain_target_db ?? 0)),
      row("Mot-clé", w ? `actuel ${w.current.detections}/${w.expected}, proposé ${w.proposed.detections}/${w.expected}`
                       : "étape C à faire")),
    el("p", { class: "help" }, followsHa()
      ? "Appliquer écrit dans les entités Home Assistant du satellite (Volume du micro, Niveau de suppression du bruit, Gain automatique)."
      : "Appliquer enregistre dans la configuration de l'app (sans redémarrage)."),
    el("div", { class: "row-buttons" },
      el("button", { type: "button", class: "primary", disabled: calib.busy || null,
                     onclick: () => applySettings(values, true) }, "Tout appliquer")));
}

function renderCalibration() {
  const names = (saved?.satellites || []).map((s) => s.name);
  const disabled = calib.busy || !calib.satellite;
  const select = el("select", { disabled: calib.busy || null },
    names.map((name) => el("option", { value: name }, name)));
  select.value = calib.satellite || "";
  select.addEventListener("change", async () => {
    await clearRecordings();
    calib.satellite = select.value;
    renderCalibration();
    startMeter();
  });
  const step = (title, ...content) =>
    el("div", { class: "sub" }, el("div", { class: "sub-title" }, title), ...content);
  panels.calibration.replaceChildren(el("div", { class: "calib" },
    el("div", {},
      el("div", { class: "card panel" },
        el("h2", {}, "Satellite"),
        el("label", {}, select),
        el("p", { class: "help", id: "calib-volume" }, ""),
        followsHa() && el("p", { class: "help" },
          el("span", { class: "pill" }, "piloté par Home Assistant"),
          " Les réglages proposés sont écrits dans les entités Home Assistant du satellite."),
        el("h2", { style: "margin-top: 12px" }, "Niveaux en direct"),
        el("div", { class: "vu", id: "calib-vu" }, ...vuRow("Avant traitement", null, false),
           ...vuRow("Après (envoyé à HA)", null, true)),
        el("p", { class: "help" },
          "Barre : niveau RMS · trait : crête · repère : cible de la voix (−20 dBFS) · " +
          "contour rouge : écrêtage. Le calibrage ne coupe jamais le son envoyé à Home Assistant.")),
      resultsCard(),
      summaryCard()),
    el("div", { class: "card panel steps" },
      el("h2", {}, "Assistant de calibrage"),
      step("1. Bruit de fond",
        el("p", { class: "help" }, "Restez silencieux pendant 5 secondes, dans les conditions habituelles (PC, frigo…)."),
        calib.noise && el("p", {}, `Bruit de fond mesuré : ${dbfs(calib.noise.rms_db)}`),
        el("button", { type: "button", disabled: disabled || null,
                       onclick: () => recordStep("noise") },
           calib.noise ? "Mesurer à nouveau" : "Mesurer le bruit (5 s)")),
      step("2. Voix et volume",
        el("p", { class: "help" }, "À votre distance habituelle du micro, d'une voix normale, lisez pendant 8 secondes :"),
        el("p", { class: "phrase" }, CALIB_PHRASE),
        el("button", { type: "button", disabled: disabled || !calib.noise || null,
                       onclick: () => recordStep("voice") }, "Lire la phrase (8 s)")),
      step("A. Réduction de bruit", denoiseStep()),
      step("B. Gain automatique", autogainStep()),
      step("C. Test du mot-clé", wakeStep()),
      el("p", { id: "calib-progress", class: "help" }, ""),
      el("p", { class: "help" },
        "Les enregistrements restent en mémoire, jamais sur disque. Ceux d'une étape sont effacés " +
        "quand on l'applique, tous le sont avec « Tout appliquer », en quittant l'onglet, ou au bout de 15 minutes."))));
}

/* Tabs */

function showTab(name) {
  currentTab = name;
  for (const tab of document.querySelectorAll(".tab")) {
    tab.setAttribute("aria-selected", String(tab.dataset.tab === name));
  }
  for (const [key, panel] of Object.entries(panels)) panel.hidden = key !== name;
  document.getElementById("actions").hidden = name === "status" || name === "calibration";
  try { localStorage.setItem("vban-satellite-tab", name); } catch (err) { /* private mode */ }
  if (name === "status") refreshStatus();
  if (name === "calibration") openCalibration();
  else closeCalibration();
}

for (const tab of document.querySelectorAll(".tab")) {
  tab.addEventListener("click", () => showTab(tab.dataset.tab));
}

// Browser tab hidden: no live meter (it would stream for nothing)
document.addEventListener("visibilitychange", () => {
  if (currentTab !== "calibration") return;
  if (document.hidden) stopMeter();
  else startMeter();
});

/* Load, save, import, export */

async function load() {
  say("Chargement…");
  const resp = await fetch("api/options");
  const body = await resp.json();
  if (!resp.ok) {
    say(body.error || "Impossible de lire la configuration", "error");
    return;
  }
  saved = body.options;
  // Fill what the editor adds anyway, so loading doesn't look like a change
  saved.debug_mirror = saved.debug_mirror || [];
  for (const sat of saved.satellites || []) {
    for (const block of BLOCKS) sat[block] = sat[block] || {};
  }
  options = JSON.parse(JSON.stringify(saved));
  if (body.version) document.getElementById("version").textContent = `v${body.version}`;
  renderConfig();
  if (currentTab === "calibration" && !calib.busy && !calib.result) openCalibration();
  setDirty();
  say("");
}

saveButton.addEventListener("click", async () => {
  saveButton.disabled = true;
  say("Enregistrement et application…");
  try {
    const resp = await fetch("api/options", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ options: forSave(options) }),
    });
    const body = await resp.json();
    if (!resp.ok) {
      say(body.error || `Erreur ${resp.status}`, "error");
      setDirty();
      if (resp.status === 409) await load();
      return;
    }
    await load();
    const done = body.done && body.done.length ? ` ${body.done.map(translateDone).join(" ; ")}.`
                                                : " Aucun changement à appliquer.";
    say(`Configuration enregistrée et appliquée.${done}`, "ok");
  } catch (err) {
    say(`Erreur : ${err}`, "error");
    setDirty();
  }
});

revertButton.addEventListener("click", () => {
  options = JSON.parse(JSON.stringify(saved));
  renderConfig();
  setDirty();
  say("");
});

document.getElementById("export").addEventListener("click", async () => {
  try {
    const resp = await fetch("api/export", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ options: forSave(options) }),
    });
    if (!resp.ok) { say("Export impossible", "error"); return; }
    const link = el("a", { href: URL.createObjectURL(await resp.blob()),
                           download: "vban-satellite.yaml" });
    link.click();
    // Revoked later: right away can cancel the download in some browsers
    setTimeout(() => URL.revokeObjectURL(link.href), 10000);
  } catch (err) {
    say(`Export impossible : ${err}`, "error");
  }
});

const importFile = document.getElementById("import-file");
document.getElementById("import").addEventListener("click", () => importFile.click());
importFile.addEventListener("change", async () => {
  const file = importFile.files[0];
  importFile.value = "";
  if (!file) return;
  let resp, body;
  try {
    resp = await fetch("api/import", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ yaml: await file.text() }),
    });
    body = await resp.json();
  } catch (err) {
    say(`Import impossible : ${err}`, "error");
    return;
  }
  if (!resp.ok) { say(body.error || "Import impossible", "error"); return; }
  options = body.options;
  renderConfig();
  setDirty();
  say(`« ${file.name} » importé : vérifiez, puis enregistrez pour l'appliquer.`);
});

window.addEventListener("beforeunload", (event) => {
  if (isDirty()) event.preventDefault();
});

let initialTab = "satellites";
try { initialTab = localStorage.getItem("vban-satellite-tab") || initialTab; } catch (err) { /* private mode */ }
showTab(panels[initialTab] ? initialTab : "satellites");
load().catch((err) => say(`Erreur : ${err}`, "error"));
setInterval(refreshStatus, 2000);
</script>
</body>
</html>
